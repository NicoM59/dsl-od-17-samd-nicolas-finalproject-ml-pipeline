name: MLOps Pipeline - Test & Auto-Train

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # JOB 1 : Exécution de la suite de tests Pytest (Vérification du code)
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Exécuter les 11 tests unitaires (Pytest)
        run: |
          pytest

  # JOB 2 : Réentraînement automatique du modèle (Uniquement si le JOB 1 a réussi)
  auto-train-model:
    runs-on: ubuntu-latest
    needs: run-tests # <-- Condition magique : attend le succès des tests
    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Configurer les identifiants AWS temporaires pour la session d'entraînement
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 🏋️ Lancement de l'entraînement lourd et Envoi vers MLflow
        env:
          # GitHub prend le secret et le transforme en variable d'environnement système
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python app/train.py --data_url "s3://dsl-od-17-samd-nicolas-finalproject/Mental Health Disorder Detection Dataset.csv"
