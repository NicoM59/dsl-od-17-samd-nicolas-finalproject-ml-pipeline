name: MLOps Pipeline - Test & Auto-Train

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  repository_dispatch:
    types: [trigger-training]
  workflow_dispatch:

jobs:
  # ============================================================================
  # JOB 1 : Exécution de la suite de tests (Séparés par typologie)
  # ============================================================================
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx  # On s'assure que httpx est là pour TestClient

      # ----------------------------------------------------------------------
      # 🧪 PHASE 1 : Les tests du Modèle et de la Donnée
      # ----------------------------------------------------------------------
      - name: 🧠 Tester le Modèle et le Preprocessing
        # Ici, remplace "tests/test_model.py" par le nom de ton ancien fichier de test
        run: |
          pytest tests/test_pipeline.py -v

      # ----------------------------------------------------------------------
      # 🌐 PHASE 2 : Les tests de l'API FastAPI
      # ----------------------------------------------------------------------
      - name: 🚀 Tester l'API FastAPI (Mode Mock)
        env:
          TEST_MODE: "True" # 🌟 Coupe AWS/MLflow EXCLUSIVEMENT pour cette étape
        run: |
          pytest tests/test_api.py -v

  # ============================================================================
  # JOB 2 : Réentraînement automatique (Uniquement si JOB 1 a réussi)
  # ============================================================================
  auto-train-model:
    runs-on: ubuntu-latest
    needs: run-tests # 🚦 Condition magique : attend le succès des tests
    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Configurer les identifiants AWS temporaires
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 🏋️ Lancement de l'entraînement lourd et Envoi vers MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python -u -m app.train --data_url "s3://dsl-od-17-samd-nicolas-finalproject/Mental Health Disorder Detection Dataset.csv"
