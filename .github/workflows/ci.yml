name: MLOps Pipeline - Test & Auto-Train

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  repository_dispatch:
    types: [trigger-training]
  workflow_dispatch:

jobs:
  # ============================================================================
  # JOB 1 : Exécution de la suite de tests (Ordonnés du plus rapide au plus long)
  # ============================================================================
  run-tests:
    runs-on: ubuntu-latest
    env:
      DATASET_PATH: ${{ vars.DATASET_PATH }}

    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx mlflow requests  # On s'assure d'avoir tout pour les tests

      # ----------------------------------------------------------------------
      # 📡 PHASE 1 : Test de l'Infrastructure (Health Check EC2 -> Neon)
      # ----------------------------------------------------------------------
      - name: 🗄️ Vérifier l'Infrastructure (EC2 & Neon DB)
        env:
          # On passe l'URL magique à pytest pour qu'il puisse faire le ping
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          # Le -s permet d'afficher les superbes "prints" qu'on a codés ensemble
          pytest -s tests/test_infra.py -v

      # ----------------------------------------------------------------------
      # 🌐 PHASE 2 : Les tests de l'API FastAPI
      # ----------------------------------------------------------------------
      - name: 🚀 Tester l'API FastAPI (Mode Mock)
        env:
          TEST_MODE: "True" # 🌟 Coupe AWS/MLflow EXCLUSIVEMENT pour cette étape
        run: |
          pytest tests/test_api.py -v

      # ----------------------------------------------------------------------
      # 🧪 PHASE 3 : Les tests du Modèle, de la Donnée et du Preprocessing
      # ----------------------------------------------------------------------
      - name: 🧠 Tester le Modèle et le Preprocessing
        run: |
          pytest tests/test_pipeline.py -v

  # ============================================================================
  # JOB 2 : Réentraînement automatique (Uniquement si TOUS les tests du JOB 1 ont réussi)
  # ============================================================================
  auto-train-model:
    runs-on: ubuntu-latest
    needs: run-tests # 🚦 Condition magique : attend le succès de TOUS les tests ci-dessus
    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Configurer les identifiants AWS temporaires
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 🏋️ Lancement de l'entraînement lourd et Envoi vers MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          DATASET_PATH: ${{ vars.DATASET_PATH }} # 🌟 Appel de la variable GitHub
        run: |
          # Ton script train.py va maintenant lire DATASET_PATH via os.getenv()
          python -u -m app.train
